<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Post}}Edit post{{else}}New post{{end}}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="page-loaded">
    <header>
        <h1>{{if .Post}}Edit post{{else}}New post{{end}}</h1>
        <nav class="site-nav">
            <a href="/admin">Back to posts</a>
        </nav>
    </header>
    <main>
        <form class="post-form" method="POST" action="{{if .Post}}/admin/posts/{{.Post.ID}}/edit{{else}}/admin/posts/new{{end}}">
            {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{if .Post}}{{.Post.Title}}{{end}}" required autofocus>

            <label for="content">Content (Markdown)</label>
            <textarea id="content" name="content" rows="20" required>{{if .Post}}{{.Post.ContentMarkdown}}{{end}}</textarea>

            <label class="checkbox-label">
                <input type="checkbox" name="published" {{if and .Post .Post.Published}}checked{{end}}>
                Published
            </label>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/admin" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
