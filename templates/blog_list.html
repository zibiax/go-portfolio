<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog · Martin Evenbom</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="page-loaded">
    <header>
        <h1 class="gradient-text">Blog</h1>
        <nav class="site-nav">
            <a href="/">Home</a>
        </nav>
    </header>
    <main>
        {{if not .Posts}}
        <p>No posts yet.</p>
        {{else}}
        <div class="blog-feed">
            {{range .Posts}}
            <section class="blog-feed-item">
                <h2><a href="/blog/{{.Slug}}">{{.Title}}</a></h2>
                <p class="blog-list-date">{{.CreatedAt.Format "January 2, 2006 at 15:04"}}</p>
                <article class="blog-post">
                    {{.ContentHTML}}
                </article>
            </section>
            {{end}}
        </div>
        {{end}}
    </main>
</body>
</html>
