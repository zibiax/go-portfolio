<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://unpkg.com/htmx.org@1.6.1"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/js/bundle.css">
    <script>
        // Add debugging for HTMX events
        document.addEventListener('htmx:afterRequest', function(evt) {
            console.log('HTMX Request completed:', evt.detail);
            if (evt.detail.failed) {
                console.error('HTMX Request failed:', evt.detail.xhr.responseText);
            }
        });

        document.addEventListener('htmx:afterSwap', function(evt) {
            console.log('HTMX Content swapped:', evt.detail);
        });
    </script>
</head>
<body class="preload">
    <div class="splash-screen" aria-hidden="true">
        <div class="splash-content">
            <p class="splash-kicker">Hi, I'm Martin Evenbom</p>
            <h2 class="splash-title">Computer Engineering Student</h2>
            <p class="splash-subtitle">Always learning, building, and sharing what I discover.</p>
        </div>
        <div class="splash-orb splash-orb--one"></div>
        <div class="splash-orb splash-orb--two"></div>
    </div>
    <noscript>
        <style>
            body.preload header,
            body.preload main { opacity: 1 !important; transform: none !important; }
            .splash-screen { display: none !important; }
        </style>
    </noscript>
    <header>
        <h1>Martin Evenbom · Computer Engineering Student</h1>
        <p class="site-tagline">Always learning and improving through code.</p>
    </header>
    <main>
        <div id="projects" 
             hx-get="/projects" 
             hx-trigger="load" 
             hx-swap="innerHTML"
             hx-indicator="#loading">
            <div id="loading">Loading projects...</div>
        </div>
    </main>
    <script src="/static/js/bundle.js"></script>
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.body.classList.remove('preload');
                document.body.classList.add('page-loaded');
            }, 2000);
        });
    </script>
</body>
</html>
