<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Evenbom · Portfolio</title>
    <meta name="description" content="Portfolio of Martin Evenbom, computer engineering student — projects, code and writing.">
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/img/favicon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/js/bundle.css">
</head>
<body>
    <header class="site-header">
        <p class="site-kicker">Hi, I'm Martin Evenbom</p>
        <h1 class="gradient-text">Computer Engineering Student</h1>
        <p class="site-tagline">Always learning, building, and sharing what I discover.</p>
        <nav class="site-nav">
            <a href="/blog">Blog</a>
            <a href="https://github.com/zibiax" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
    </header>
    <main>
        <section class="projects-section">
            <h2 class="section-heading">Some of my projects on GitHub</h2>
            <div id="projects" class="project-grid" aria-busy="true" aria-live="polite"></div>
            <p id="projects-status" class="projects-status">Loading projects…</p>
            <div class="projects-actions">
                <button id="load-more" type="button" class="btn btn-secondary" hidden>Load more projects</button>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p>© <span id="year">2026</span> Martin Evenbom</p>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="/static/js/bundle.js"></script>

</html>
